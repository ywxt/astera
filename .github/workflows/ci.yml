name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"

jobs:
  quality:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Install compositor build dependencies
        run: sudo apt-get update && sudo apt-get install -y libwayland-dev libxkbcommon-dev libudev-dev libinput-dev libgbm-dev libseat-dev libegl1-mesa-dev xvfb
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test workspace (rerun failures for diagnostics)
        shell: bash
        run: |
          set +e
          cargo test --workspace --all-targets
          status=$?
          if (( status != 0 )); then
            cargo test --workspace --all-targets -- --nocapture || true
          fi
          exit "$status"
      - name: Nested compositor smoke test
        run: .github/scripts/nested-smoke.sh

  msrv:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.95.0
      - uses: Swatinem/rust-cache@v2
      - name: Install compositor build dependencies
        run: sudo apt-get update && sudo apt-get install -y libwayland-dev libxkbcommon-dev libudev-dev libinput-dev libgbm-dev libseat-dev libegl1-mesa-dev
      - run: cargo check --workspace --all-targets

  coverage:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: taiki-e/install-action@cargo-llvm-cov
      - uses: Swatinem/rust-cache@v2
      - name: Install compositor build dependencies
        run: sudo apt-get update && sudo apt-get install -y libwayland-dev libxkbcommon-dev libudev-dev libinput-dev libgbm-dev libseat-dev libegl1-mesa-dev
      - name: Install diff coverage reporter
        if: github.event_name == 'pull_request'
        run: pipx install diff-cover
      - name: Core coverage (90%)
        run: cargo llvm-cov -p astera-core --all-targets --fail-under-lines 90
      - name: Portable support crates coverage (70%)
        run: cargo llvm-cov -p astera-config -p astera-ipc --all-targets --fail-under-lines 70
      - name: Workspace coverage baseline
        # Native device and render-loop paths require the mock/harness work tracked by this
        # test architecture. Keep today's 51% whole-workspace baseline from regressing.
        run: cargo llvm-cov --workspace --all-targets --fail-under-lines 51 --cobertura --output-path cobertura.xml
      - name: Changed-line coverage (90%)
        if: github.event_name == 'pull_request'
        run: diff-cover cobertura.xml --compare-branch=origin/${{ github.base_ref }} --fail-under=90
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage
          path: cobertura.xml
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: render-diagnostics
          path: target/render-artifacts
          if-no-files-found: ignore

  miri:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@miri
      - uses: Swatinem/rust-cache@v2
      - run: cargo miri test -p astera-core

  aarch64:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
          targets: aarch64-unknown-linux-gnu
      - uses: Swatinem/rust-cache@v2
      - name: Cross-check portable crates
        run: cargo clippy -p astera-core -p astera-ipc --target aarch64-unknown-linux-gnu -- -D warnings
